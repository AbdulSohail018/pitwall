name: Refresh live F1 data

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull data from Jolpica and OpenF1
        run: python -m pitwall.refresh
      - name: Build warehouse and run data-quality tests
        if: ${{ hashFiles('pitwall/warehouse.py') != '' }}
        run: python -m pitwall.warehouse --test
      - name: Regenerate insights report
        if: ${{ hashFiles('pitwall/insights.py') != '' }}
        run: python -m pitwall.insights
      - name: Commit refreshed data
        run: |
          git config user.name "Abdul Sohail"
          git config user.email "abdulsohail018@gmail.com"
          git add data
          if [ -f INSIGHTS.md ]; then git add INSIGHTS.md; fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
