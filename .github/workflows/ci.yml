name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - name: Unit tests (synthetic season, no network)
        run: pytest -q
      - name: Data-quality tests on the committed live data
        run: python -m pitwall.warehouse --test
